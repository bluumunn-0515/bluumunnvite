<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동차 정비 AI 튜터</title>
    <!-- 모바일 친화적 UI를 위한 Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #111827; /* 다크 모드 배경 */
            color: #e5e7eb;
        }
        
        /* 로딩 애니메이션 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 채팅 말풍선 스타일 */
        .chat-bubble {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            max-width: 90%;
        }
        .user-bubble {
            background-color: #374151;
            margin-left: auto;
            color: white;
        }
        .ai-bubble {
            background-color: #1d4ed8;
            margin-right: auto;
            color: white;
            border: 1px solid #3b82f6;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4">

    <!-- 앱 헤더 -->
    <header class="w-full max-w-md p-4 mb-4 text-center bg-gray-800 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-blue-400">🚗 Car Doctor AI</h1>
        <p class="text-sm text-gray-400">자동차 증상을 말하면 원인을 진단해드립니다.</p>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="w-full max-w-md space-y-4">
        
        <!-- 1. 사용자 정보 입력 -->
        <section class="p-4 bg-gray-800 rounded-lg shadow">
            <label class="block mb-2 text-sm font-bold text-gray-300">학번 / 이름</label>
            <input type="text" id="studentName" class="w-full p-2 text-black rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: 30101 홍길동">
        </section>

        <!-- 2. 증상 입력 및 AI 진단 요청 -->
        <section class="p-4 bg-gray-800 rounded-lg shadow">
            <label class="block mb-2 text-sm font-bold text-gray-300">자동차 이상 증상</label>
            <textarea id="carSymptom" rows="3" class="w-full p-2 text-black rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: 시동 걸 때 끼익 소리가 나요."></textarea>
            <button onclick="askAI()" class="w-full py-2 mt-3 font-bold text-white transition bg-blue-600 rounded hover:bg-blue-700">
                AI 진단 받기 🔧
            </button>
            <div id="loader" class="loader"></div>
        </section>

        <!-- 3. AI 진단 결과 표시 -->
        <section id="resultSection" class="hidden p-4 bg-gray-800 rounded-lg shadow">
            <h3 class="mb-2 text-lg font-bold text-green-400">🤖 AI 진단 리포트</h3>
            <div id="aiResponse" class="p-3 text-sm leading-relaxed text-gray-200 bg-gray-700 rounded-lg whitespace-pre-wrap"></div>
        </section>

        <!-- 4. 학습 정리 및 제출 -->
        <section id="submitSection" class="hidden p-4 bg-gray-800 rounded-lg shadow border border-blue-500">
            <h3 class="mb-2 text-lg font-bold text-yellow-400">📝 정비 실습 보고서 작성</h3>
            <p class="mb-2 text-xs text-gray-400">AI의 진단을 바탕으로 본인의 생각이나 배운 점을 정리하세요.</p>
            <textarea id="studentReflection" rows="3" class="w-full p-2 text-black rounded focus:outline-none focus:ring-2 focus:ring-yellow-500" placeholder="AI 진단 내용을 보니 벨트 장력 문제 같습니다..."></textarea>
            
            <button onclick="submitToGoogleForm()" class="w-full py-3 mt-4 font-bold text-white bg-green-600 rounded hover:bg-green-700">
                선생님께 제출하기 🚀
            </button>
        </section>

    </main>

    <!-- 알림 모달 -->
    <div id="toast" class="fixed px-4 py-2 text-white transition-opacity duration-300 bg-gray-900 rounded shadow-lg opacity-0 bottom-5 left-1/2 transform -translate-x-1/2 pointer-events-none">
        메시지
    </div>

    <script>
        // ============================================================
        // [설정 영역] 이 부분을 본인의 정보로 수정해야 합니다.
        // 실제 배포 시에는 이 키들을 환경변수로 관리해야 안전합니다.
        // ============================================================
        const API_KEY = ""; // 여기에 OpenAI API Key를 입력하세요 (테스트용)
        
        // 구글 폼 설정 (Week 11 강의자료 참고)
        // 구글 폼의 '미리보기' 링크가 아니라 'formResponse' 링크여야 합니다.
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/YOUR_FORM_ID/formResponse"; 
        
        // 구글 폼 각 항목의 entry ID (개발자 도구로 확인)
        const ENTRY_IDS = {
            NAME: "entry.123456789",    // 학번/이름
            SYMPTOM: "entry.234567890", // 증상
            AI_RESULT: "entry.345678901", // AI 진단 결과
            REFLECTION: "entry.456789012" // 학생 정리
        };
        // ============================================================

        // 1. AI 진단 요청 함수
        async function askAI() {
            const symptom = document.getElementById('carSymptom').value;
            const loader = document.getElementById('loader');
            const resultSection = document.getElementById('resultSection');
            const submitSection = document.getElementById('submitSection');
            const aiResponseDiv = document.getElementById('aiResponse');

            if (!symptom) {
                showToast("증상을 입력해주세요!");
                return;
            }

            if (!API_KEY) {
                // API 키가 없을 때의 데모 모드
                loader.style.display = 'block';
                setTimeout(() => {
                    loader.style.display = 'none';
                    const demoResponse = `[데모 모드 답변]\n\n1. 예상 원인: 팬 벨트(구동 벨트)의 장력이 느슨해졌거나 노후화되었습니다.\n\n2. 점검 방법: 엔진룸을 열어 벨트의 균열 여부와 장력을 확인해보세요.\n\n3. 조치 사항: 장력 조절 또는 벨트 교체가 필요할 수 있습니다.`;
                    
                    aiResponseDiv.innerText = demoResponse;
                    resultSection.classList.remove('hidden');
                    submitSection.classList.remove('hidden');
                }, 1500);
                return;
            }

            // 실제 API 호출
            loader.style.display = 'block';
            resultSection.classList.add('hidden');
            
            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini", // 가성비 모델 사용
                        messages: [
                            {
                                role: "system",
                                content: "당신은 친절하고 전문적인 자동차 정비사 선생님입니다. 학생이 자동차 증상을 말하면 1. 예상 원인, 2. 점검 방법, 3. 조치 사항을 비전문가도 알기 쉽게 3가지 항목으로 나누어 설명해주세요."
                            },
                            {
                                role: "user",
                                content: symptom
                            }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                aiResponseDiv.innerText = aiText;
                resultSection.classList.remove('hidden');
                submitSection.classList.remove('hidden'); // AI 답변을 받은 후에 제출 섹션 표시

            } catch (error) {
                console.error("Error:", error);
                showToast("AI 진단 중 오류가 발생했습니다.");
                aiResponseDiv.innerText = "오류가 발생했습니다. API Key를 확인해주세요.";
                resultSection.classList.remove('hidden');
            } finally {
                loader.style.display = 'none';
            }
        }

        // 2. 구글 폼 제출 함수
        function submitToGoogleForm() {
            const name = document.getElementById('studentName').value;
            const symptom = document.getElementById('carSymptom').value;
            const aiResult = document.getElementById('aiResponse').innerText;
            const reflection = document.getElementById('studentReflection').value;

            if (!name || !reflection) {
                showToast("학번/이름과 보고서 내용을 모두 작성해주세요.");
                return;
            }

            // 실제 구글 폼 전송 로직 (iframe 방식 또는 fetch no-cors)
            // 여기서는 fetch no-cors 방식 사용
            
            const formData = new FormData();
            formData.append(ENTRY_IDS.NAME, name);
            formData.append(ENTRY_IDS.SYMPTOM, symptom);
            formData.append(ENTRY_IDS.AI_RESULT, aiResult);
            formData.append(ENTRY_IDS.REFLECTION, reflection);

            // 실제 URL이 설정되지 않았을 경우를 대비한 알림
            if (GOOGLE_FORM_URL.includes("YOUR_FORM_ID")) {
                showToast("구글 폼 URL이 설정되지 않았습니다 (데모 성공).");
                return;
            }

            fetch(GOOGLE_FORM_URL, {
                method: "POST",
                mode: "no-cors", // 중요: 구글 폼은 CORS를 지원하지 않으므로 no-cors 사용
                body: formData
            })
            .then(() => {
                showToast("성공적으로 제출되었습니다!");
                // 입력창 초기화
                document.getElementById('studentReflection').value = '';
            })
            .catch(err => {
                console.error("Form Error:", err);
                showToast("제출 중 오류가 발생했습니다.");
            });
        }

        // 토스트 메시지 표시 함수
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
