<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동차 정비 AI 튜터 - 탐구 학습 모드</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #111827;
            color: #e5e7eb;
        }
        
        /* 로딩 스피너 */
        .loader {
            border: 4px solid #374151;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 섹션 등장 효과 */
        .step-container {
            transition: all 0.5s ease-in-out;
            opacity: 0;
            transform: translateY(20px);
        }
        .step-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 pb-20">

    <header class="w-full max-w-2xl p-6 mb-6 text-center bg-gray-800 rounded-xl shadow-lg border-b-4 border-blue-600">
        <h1 class="text-3xl font-bold text-blue-400">🔧 Car Doctor AI</h1>
        <p class="mt-2 text-sm text-gray-400">학생 정보 입력 ➔ 차량 정보 설정 ➔ 증상 진단 및 정비 계획</p>
    </header>

    <main class="w-full max-w-2xl space-y-6">

        <section id="step1" class="p-6 bg-gray-800 rounded-xl shadow border border-gray-700">
            <div class="flex items-center mb-4">
                <span class="flex items-center justify-center w-8 h-8 mr-3 font-bold text-white bg-gray-600 rounded-full">1</span>
                <h2 class="text-xl font-bold text-white">학생 정보 입력</h2>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block mb-1 text-sm text-gray-400">학번 / 이름</label>
                    <input type="text" id="studentName" class="w-full p-3 bg-gray-900 border border-gray-600 rounded text-white focus:border-gray-500 focus:outline-none" placeholder="예: 30101 홍길동">
                </div>
                
                <button onclick="saveStudentInfo()" class="w-full py-3 font-bold text-white transition bg-gray-600 rounded hover:bg-gray-700">
                    등록하고 시작하기 👉
                </button>
            </div>
        </section>

        <section id="step2" class="hidden p-6 bg-gray-800 rounded-xl shadow border border-purple-600/50 step-container">
            <div class="flex items-center mb-4">
                <span class="flex items-center justify-center w-8 h-8 mr-3 font-bold text-white bg-purple-600 rounded-full">2</span>
                <h2 class="text-xl font-bold text-purple-100">차량 제원 설정</h2>
            </div>
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-1 text-sm text-gray-400">차종 선택</label>
                        <select id="carType" class="w-full p-3 bg-gray-900 border border-gray-600 rounded text-white focus:border-purple-500 focus:outline-none">
                            <option value="승용차">승용차 (Sedan/SUV)</option>
                            <option value="화물차">화물차 (Truck)</option>
                            <option value="대형버스">대형버스 (Bus)</option>
                            <option value="특수차량">특수차량</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1 text-sm text-gray-400">제조사 (브랜드)</label>
                        <input type="text" id="carBrand" class="w-full p-3 bg-gray-900 border border-gray-600 rounded text-white focus:border-purple-500 focus:outline-none" placeholder="예: 현대, BMW">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-1 text-sm text-gray-400">모델명</label>
                        <input type="text" id="carModel" class="w-full p-3 bg-gray-900 border border-gray-600 rounded text-white focus:border-purple-500 focus:outline-none" placeholder="예: 아반떼 CN7">
                    </div>
                    <div>
                        <label class="block mb-1 text-sm text-gray-400">배기량 (cc)</label>
                        <input type="number" id="carEngine" class="w-full p-3 bg-gray-900 border border-gray-600 rounded text-white focus:border-purple-500 focus:outline-none" placeholder="예: 1600">
                    </div>
                </div>

                <div>
                    <label class="block mb-1 text-sm text-gray-400">차량 특이사항 (튜닝, 노후화 등)</label>
                    <input type="text" id="carRemark" class="w-full p-3 bg-gray-900 border border-gray-600 rounded text-white focus:border-purple-500 focus:outline-none" placeholder="예: 10년 이상 노후 차량, 터보 튜닝됨">
                </div>
                
                <button onclick="saveVehicleSpecs()" class="w-full py-3 font-bold text-white transition bg-purple-600 rounded hover:bg-purple-700">
                    차량 설정 완료 (다음) 👉
                </button>
            </div>
        </section>
        
        <section id="step3" class="hidden p-6 bg-gray-800 rounded-xl shadow border border-blue-600/50 step-container">
            <div class="flex items-center mb-4">
                <span class="flex items-center justify-center w-8 h-8 mr-3 font-bold text-white bg-blue-600 rounded-full">3</span>
                <h2 class="text-xl font-bold text-white">증상 접수</h2>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block mb-1 text-sm text-gray-400">차량 이상 증상 상세 설명</label>
                    <textarea id="carSymptom" rows="3" class="w-full p-3 bg-gray-900 border border-gray-600 rounded text-white focus:border-blue-500 focus:outline-none" placeholder="예: 브레이크를 밟을 때 핸들이 심하게 떨리고 끼익 소리가 나요."></textarea>
                </div>
                
                <button onclick="analyzeSymptom()" class="w-full py-3 font-bold text-white transition bg-blue-600 rounded hover:bg-blue-700">
                    AI 원인 분석 요청 🔍
                </button>
                <div id="loader1" class="loader"></div>
            </div>
        </section>

        <section id="step4" class="hidden p-6 bg-gray-800 rounded-xl shadow border border-indigo-500/50 step-container">
            <div class="flex items-center mb-4">
                <span class="flex items-center justify-center w-8 h-8 mr-3 font-bold text-white bg-indigo-600 rounded-full">4</span>
                <h2 class="text-xl font-bold text-indigo-300">AI 진단 리포트</h2>
            </div>
            <div class="p-4 mb-4 text-sm leading-relaxed text-gray-200 bg-gray-700/50 rounded-lg border-l-4 border-indigo-500">
                <p class="mb-2 font-bold text-indigo-400">📢 AI 선생님의 분석:</p>
                <div id="aiDiagnosisOutput" class="whitespace-pre-wrap"></div>
            </div>
            <p class="text-sm text-center text-gray-400">👇 위 원인을 해결하기 위한 정비 방법을 조사하여 아래에 적어주세요.</p>
        </section>

        <section id="step5" class="hidden p-6 bg-gray-800 rounded-xl shadow border border-yellow-500/50 step-container">
            <div class="flex items-center mb-4">
                <span class="flex items-center justify-center w-8 h-8 mr-3 font-bold text-black bg-yellow-400 rounded-full">5</span>
                <h2 class="text-xl font-bold text-yellow-400">정비 및 조치사항 제출</h2>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block mb-1 text-sm text-gray-400">나의 정비 계획 (구체적으로 작성)</label>
                    <textarea id="studentActionPlan" rows="4" class="w-full p-3 bg-gray-900 border border-gray-600 rounded text-white focus:border-yellow-500 focus:outline-none" placeholder="예: 1. 타이어 마모 상태 확인... 2. 디스크 런아웃 측정..."></textarea>
                </div>
                <button onclick="evaluateStudent()" class="w-full py-3 font-bold text-black transition bg-yellow-400 rounded hover:bg-yellow-500">
                    계획 제출 및 평가 받기 📝
                </button>
                <div id="loader2" class="loader"></div>
            </div>
        </section>

        <section id="step6" class="hidden p-6 bg-gray-800 rounded-xl shadow border border-green-500 step-container">
            <div class="flex items-center mb-4">
                <span class="flex items-center justify-center w-8 h-8 mr-3 font-bold text-white bg-green-600 rounded-full">6</span>
                <h2 class="text-xl font-bold text-green-400">학습 평가 결과</h2>
            </div>
            <div id="evaluationResult" class="p-5 text-gray-100 bg-gray-900 rounded-lg border border-gray-700 whitespace-pre-wrap leading-relaxed"></div>
            <button onclick="location.reload()" class="w-full py-3 mt-6 text-sm font-bold text-gray-400 border border-gray-600 rounded hover:bg-gray-700 hover:text-white">
                새로운 증상 학습하기 🔄
            </button>
        </section>

    </main>

    <div id="toast" class="fixed px-4 py-2 text-white transition-opacity duration-300 bg-gray-900 border border-blue-500 rounded shadow-2xl opacity-0 bottom-5 left-1/2 transform -translate-x-1/2 pointer-events-none z-50">
        알림 메시지
    </div>

    <script type="module" src="./src/chatbot.js"></script>

</body>
</html>
